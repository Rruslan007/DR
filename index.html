<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>команда</title>
<style>
  :root{
    --green:#39ff14;
    --green-dim:#1c8a0e;
    --black:#000;
    --panel:#050805;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#fff;color:#000;
    font-family:"Courier New",Consolas,monospace;
    overflow:hidden;
  }
  body{position:relative;}

  /* ---------- Слой 1: белый стартовый экран ---------- */
  #startScreen{
    position:fixed;inset:0;background:#fff;z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;transition:opacity .4s ease;
  }
  #startScreen h1{
    font-weight:400;font-size:clamp(28px,8vw,48px);
    letter-spacing:.08em;margin:0 0 32px;text-transform:lowercase;
  }
  #cmdWrap{width:min(520px,100%);}
  #cmdInput{
    width:100%;
    padding:18px 16px;
    font-size:clamp(15px,4.2vw,18px);
    font-weight:300;
    font-family:inherit;
    color:#000;
    background:#fff;
    border:2px solid #000;
    border-radius:0;
    outline:none;
    text-align:center;
    letter-spacing:.04em;
    transition:box-shadow .2s;
  }
  #cmdInput::placeholder{color:#555;font-weight:300;opacity:1;}
  #cmdInput:focus{box-shadow:0 0 0 3px rgba(0,0,0,.08);}

  /* ---------- Слой 2: затемнение + квадратики ---------- */
  #hackFill{
    position:fixed;inset:0;z-index:200;
    background:#000;
    opacity:0;pointer-events:none;
    transition:opacity .6s ease;
  }
  #hackFill.active{opacity:1;pointer-events:auto;}
  #hackFill .tile{
    position:absolute;
    background:#0a1a08;
    border:1px solid rgba(57,255,20,.35);
    box-shadow:0 0 6px rgba(57,255,20,.15) inset;
    overflow:hidden;
    animation:tilePulse 3s infinite alternate;
  }
  #hackFill .tile img{
    width:100%;height:100%;object-fit:cover;display:block;
    opacity:.55;filter:grayscale(1) contrast(1.4) brightness(.7) sepia(.2) hue-rotate(70deg);
  }
  @keyframes tilePulse{
    0%{box-shadow:0 0 4px rgba(57,255,20,.12) inset;}
    100%{box-shadow:0 0 10px rgba(57,255,20,.4) inset;}
  }

  /* ---------- Слой 3: терминальное окно ---------- */
  #terminal{
    position:fixed;inset:0;z-index:300;
    background:#000;
    display:none;
    padding:14px;
    opacity:0;
    transition:opacity .7s ease;
  }
  #terminal.show{display:flex;opacity:1;align-items:center;justify-content:center;}

  .termFrame{
    width:100%;height:100%;
    max-width:900px;max-height:100%;
    background:var(--panel);
    border:2px solid var(--green);
    box-shadow:0 0 12px rgba(57,255,20,.5), 0 0 40px rgba(57,255,20,.15) inset;
    display:flex;flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  /* «зелёные пиксельные бока» */
  .termFrame::before,
  .termFrame::after{
    content:"";
    position:absolute;top:0;bottom:0;width:14px;
    background-image:
      repeating-linear-gradient(
        to bottom,
        var(--green) 0 4px,
        transparent 4px 8px
      );
    opacity:.55;
    pointer-events:none;
  }
  .termFrame::before{left:0;box-shadow:2px 0 8px rgba(57,255,20,.25);}
  .termFrame::after{right:0;box-shadow:-2px 0 8px rgba(57,255,20,.25);}

  /* верхняя «палка» (без мигающих точек) */
  .termTopBar{
    height:34px;flex:0 0 auto;
    border-bottom:1px solid rgba(57,255,20,.35);
    display:flex;align-items:center;
    padding:0 18px;
    position:relative;
  }
  .termTopBar .barLine{
    position:absolute;left:18px;right:18px;top:50%;
    height:2px;background:rgba(57,255,20,.35);transform:translateY(-50%);
  }

  /* лента сообщений */
  .termBody{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 22px 24px;
    color:var(--green);
    font-size:clamp(13px,3.6vw,16px);
    line-height:1.55;
    text-shadow:0 0 4px rgba(57,255,20,.55);
    scrollbar-width:thin;
    scrollbar-color:var(--green) #000;
  }
  .termBody::-webkit-scrollbar{width:6px;}
  .termBody::-webkit-scrollbar-thumb{background:var(--green);}
  .termBody::-webkit-scrollbar-track{background:#000;}

  .msg{
    margin:0 0 18px;
    white-space:pre-wrap;
    word-break:break-word;
    opacity:0;
    transform:translateY(6px);
    animation:msgIn .45s ease forwards;
  }
  @keyframes msgIn{to{opacity:1;transform:none;}}

  /* комплимент в форме цитаты */
  .quote{
    margin:0 0 16px;
    padding:10px 14px;
    border-left:3px solid rgba(57,255,20,.8);
    background:rgba(57,255,20,.05);
    color:var(--green);
    text-shadow:0 0 4px rgba(57,255,20,.55);
    opacity:0;
    animation:msgIn .45s ease forwards;
    white-space:pre-wrap;
  }

  .photoBlock{
    margin:14px 0 22px;
    position:relative;
    border:2px solid rgba(57,255,20,.3);
    padding:4px;
    background:#000;
  }
  .photoBlock .photoStatus{
    position:absolute;top:-10px;right:8px;
    background:#000;padding:0 6px;
    font-size:11px;color:var(--green);
    opacity:.85;
    z-index:2;
  }
  .photoBlock img{
    display:block;width:100%;height:auto;
    max-height:60vh;object-fit:contain;
    background:#0a0a0a;
  }
  /* фото Funny повёрнуто на 90° (низ справа, верх слева) */
  .photoBlock img.rot90{
    transform:rotate(90deg);
    transform-origin:center center;
    max-height:none;
    width:auto;
    max-width:60vh;
    margin:0 auto;
  }
  .photoBlock.rotWrap{
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    min-height:60vh;
  }
  .photoBlock.loading{border-color:rgba(57,255,20,.35);}
  .photoBlock.done{border-color:var(--green);box-shadow:0 0 10px rgba(57,255,20,.35);}

  /* смайлик снизу вверх */
  .smiley{
    margin:24px auto 8px;
    display:block;
    color:var(--green);
    font-size:clamp(10px,2.6vw,14px);
    line-height:1;
    text-align:center;
    white-space:pre;
    font-family:"Courier New",monospace;
    text-shadow:0 0 6px rgba(57,255,20,.6);
  }
  .smiley .ln{
    display:block;
    opacity:0;
    transform:translateY(6px);
    animation:smileyLine .18s ease forwards;
  }
  @keyframes smileyLine{to{opacity:1;transform:none;}}

  /* нижние кнопки */
  .termActions{
    flex:0 0 auto;
    display:flex;gap:10px;
    padding:12px 18px 16px;
    border-top:1px solid rgba(57,255,20,.35);
    background:#020402;
  }
  .hbtn{
    flex:1 1 0;
    border:none;
    font-family:inherit;
    font-size:clamp(13px,3.8vw,16px);
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:14px 10px;
    border-radius:2px;
    cursor:pointer;
    transition:transform .12s ease, filter .2s ease, opacity .3s;
    user-select:none;
  }
  .hbtn:active{transform:scale(.97);}
  .hbtn.start{
    background:#f5c400;color:#000;
    box-shadow:0 0 14px rgba(245,196,0,.45);
  }
  .hbtn.reset{
    background:#f5c400;color:#000;
    box-shadow:0 0 12px rgba(245,196,0,.4);
  }
  .hbtn.exit{
    background:#d21b1b;color:#fff;
    box-shadow:0 0 12px rgba(210,27,27,.45);
  }
  .hbtn.hidden{display:none;}

  #blackout{
    position:fixed;inset:0;background:#000;z-index:500;
    opacity:0;pointer-events:none;transition:opacity .4s ease;
  }
  #blackout.active{opacity:1;pointer-events:auto;}

  @media (max-width:420px){
    .termBody{padding:12px 16px 20px;}
    .termActions{padding:10px 12px 14px;}
  }
</style>
</head>
<body>

<!-- ===== 1. Стартовый экран ===== -->
<div id="startScreen">
  <h1>команда</h1>
  <div id="cmdWrap">
    <input id="cmdInput" type="text" inputmode="text" autocomplete="off"
           spellcheck="false" placeholder="Напишите команду">
  </div>
</div>

<!-- ===== 2. Заполнение экрана квадратиками ===== -->
<div id="hackFill"></div>

<!-- ===== 3. Терминал ===== -->
<div id="terminal">
  <div class="termFrame">
    <div class="termTopBar">
      <span class="barLine"></span>
    </div>
    <div class="termBody" id="termBody"></div>
    <div class="termActions">
      <button class="hbtn start" id="btnStart">старт</button>
      <button class="hbtn exit hidden" id="btnExit">выйти</button>
      <button class="hbtn reset hidden" id="btnReset">сбросить</button>
    </div>
  </div>
</div>

<div id="blackout"></div>

<script>
(function(){
  "use strict";

  const CODES = {
    "23102025_007": "greeting",
    "3010201207062012": "compliments"
  };

  const startScreen = document.getElementById('startScreen');
  const cmdInput    = document.getElementById('cmdInput');
  const hackFill    = document.getElementById('hackFill');
  const terminal    = document.getElementById('terminal');
  const termBody    = document.getElementById('termBody');
  const btnStart    = document.getElementById('btnStart');
  const btnExit     = document.getElementById('btnExit');
  const btnReset    = document.getElementById('btnReset');
  const blackout    = document.getElementById('blackout');

  const IMG = {
    beautiful:  "https://rruslan007.github.io/novara-city-images/DR/Beautiful.heic",
    beautiful2: "https://rruslan007.github.io/novara-city-images/DR/Beautiful_2.heic",
    funny:      "https://rruslan007.github.io/novara-city-images/DR/Funny.JPG",
    haker:      "https://rruslan007.github.io/novara-city-images/DR/haker.JPG"
  };

  let busy = false;
  let typingTimers = [];
  let tileTimeouts = [];
  let currentMode = "greeting";

  /* ---------- Ввод кода ---------- */
  function checkCode(){
    if (busy) return;
    const val = cmdInput.value.trim();
    if (CODES[val]){
      busy = true;
      currentMode = CODES[val];
      cmdInput.blur();
      cmdInput.value = val;
      runIntroSequence();
    }
  }
  cmdInput.addEventListener('input', checkCode);
  cmdInput.addEventListener('change', checkCode);

  /* ---------- Сценарий входа ---------- */
  function runIntroSequence(){
    startScreen.style.opacity = '0';
    setTimeout(function(){
      startScreen.style.display = 'none';
      fillWithTiles();
    }, 420);
  }

  /* ---------- ~1000 квадратиков ---------- */
  function fillWithTiles(){
    hackFill.innerHTML = '';
    hackFill.classList.add('active');

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    let tileSize = Math.max(18, Math.round(Math.sqrt((vw * vh) / 1000)));
    tileSize = Math.min(tileSize, Math.max(18, Math.round(Math.min(vw, vh) / 8)));

    const cols = Math.ceil(vw / tileSize) + 1;
    const rows = Math.ceil(vh / tileSize) + 1;

    const frag = document.createDocumentFragment();
    const tiles = [];

    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.left = (c * tileSize) + 'px';
        t.style.top  = (r * tileSize) + 'px';
        t.style.width  = (tileSize - 2) + 'px';
        t.style.height = (tileSize - 2) + 'px';
        t.style.zIndex = String(1 + ((r * 7 + c * 3) % 5));
        frag.appendChild(t);
        tiles.push(t);
      }
    }
    hackFill.appendChild(frag);

    const centerIndex = Math.floor(rows / 2) * cols + Math.floor(cols / 2);
    const centerTile = tiles[centerIndex];
    if (centerTile){
      const img = document.createElement('img');
      img.src = IMG.haker;
      img.alt = '';
      img.style.objectFit = 'cover';
      centerTile.appendChild(img);
      centerTile.style.borderColor = 'var(--green)';
      centerTile.style.zIndex = '20';
    }

    const order = tiles.map((t, i) => i).filter(i => i !== centerIndex);
    for (let i = order.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }

    const BATCH = Math.max(40, Math.ceil(order.length / 14));
    let cursor = 0;

    function nextBatch(){
      if (cursor >= order.length){
        tileTimeouts.push(setTimeout(fadeToTerminal, 550));
        return;
      }
      const end = Math.min(cursor + BATCH, order.length);
      for (let k = cursor; k < end; k++){
        const t = tiles[order[k]];
        if (!t) continue;
        if (Math.random() < 0.12){
          const im = document.createElement('img');
          im.src = IMG.haker;
          t.appendChild(im);
        } else {
          t.style.background = 'rgba(10,40,8,' + (0.35 + Math.random() * 0.5).toFixed(2) + ')';
        }
      }
      cursor = end;
      tileTimeouts.push(setTimeout(nextBatch, 45));
    }
    nextBatch();
  }

  function fadeToTerminal(){
    hackFill.style.transition = 'opacity .6s ease';
    hackFill.style.opacity = '0';
    setTimeout(function(){
      hackFill.classList.remove('active');
      hackFill.innerHTML = '';
      hackFill.style.opacity = '';
      hackFill.style.transition = '';
      openTerminal();
    }, 620);
  }

  /* ---------- Терминал ---------- */
  function openTerminal(){
    termBody.innerHTML = '';
    btnStart.classList.remove('hidden');
    btnExit.classList.add('hidden');
    btnReset.classList.add('hidden');
    btnStart.dataset.running = '';
    terminal.classList.add('show');
  }

  function clearTyping(){
    typingTimers.forEach(clearTimeout);
    typingTimers = [];
  }

  /* ---------- Кнопка СТАРТ ---------- */
  btnStart.addEventListener('click', function(){
    if (btnStart.dataset.running === '1') return;
    btnStart.dataset.running = '1';
    btnStart.classList.add('hidden');
    btnExit.classList.remove('hidden');
    btnReset.classList.remove('hidden');
    termBody.innerHTML = '';

    if (currentMode === "compliments"){
      printCompliments();
    } else {
      printGreeting();
    }
  });

  /* ---------- Режим 1: поздравление (как в первом коде) ---------- */
  const GREETING = [
    {text:"С днём рождения, самая лучшая подруга!)"},
    {text:"Желаю тебе крепкого здоровья, благополучия, моря счастья. Оставайся такой же красоткой.", photo:'beautiful2', alt:'beautiful2'},
    {text:"Желаю тебе всегда быть на позитиве, как девочка на переднем плане, а не как «злой пацан» на заднем плане.", photo:'funny', alt:'funny', rot:true},
    {text:"Ну и напоследок: будь всегда уверенной в себе, пусть улыбка всегда остаётся на твоём лице, пусть тебя окружают только верные люди. Желаю тебе учиться на одни пятёрки, кучу-прекучу подарков, слушаться взрослых и не капризничать. Желаю обходить все преграды, чтобы все твои желания всегда исполнялись. Оставайся такой же красоткой и моим львёнком. С днём рождения, подруга, люблю тебя!)", photo:'beautiful', alt:'beautiful'}
  ];

  function printGreeting(){
    let delay = 250;
    GREETING.forEach(function(block){
      typingTimers.push(setTimeout(function(){
        addTextMessage(block.text);
        if (block.photo){
          typingTimers.push(setTimeout(function(){
            addPhoto(block.photo, block.alt, block.rot);
          }, 380));
        }
      }, delay));
      delay += 1500;
    });
    typingTimers.push(setTimeout(drawSmiley, delay + 800));
  }

  function addTextMessage(text){
    const p = document.createElement('p');
    p.className = 'msg';
    p.textContent = '> ' + text;
    termBody.appendChild(p);
    termBody.scrollTop = termBody.scrollHeight;
  }

  /* ---------- Режим 2: 10 комплиментов-цитат ---------- */
  const COMPLIMENTS = [
    "«У тебя невероятная красота — она светится изнутри.»",
    "«У тебя самый добрый характер — с тобой тепло и спокойно.»",
    "«В тебе есть милая хитрость, которая делает тебя обворожительной.»",
    "«Твоё флиртование — это отдельный вид искусства.»",
    "«Ты — чистая радость, которая заряжает всех вокруг.»",
    "«Твоя логика всегда на высоте — с тобой не пропадёшь.»",
    "«Твоя привлекательность — это не только внешность, но и энергия.»",
    "«Ты невероятно милая — это твоя суперсила.»",
    "«С тобой всегда весело — ты умеешь зажечь любой день.»",
    "«С тобой так хорошо проводить время, что часы пролетают незаметно.»"
  ];

  function printCompliments(){
    let delay = 300;
    COMPLIMENTS.forEach(function(text){
      typingTimers.push(setTimeout(function(){
        const q = document.createElement('div');
        q.className = 'quote';
        q.textContent = text;
        termBody.appendChild(q);
        termBody.scrollTop = termBody.scrollHeight;
      }, delay));
      delay += 1400;
    });
    typingTimers.push(setTimeout(drawSmiley, delay + 800));
  }

  /* ---------- Фото с зелёной рамкой и прогрессом (как в первом коде) ---------- */
  function addPhoto(key, alt, rot){
    const wrap = document.createElement('div');
    wrap.className = 'photoBlock loading';
    if (rot) wrap.classList.add('rotWrap');

    const status = document.createElement('span');
    status.className = 'photoStatus';
    status.textContent = '0%';

    const img = document.createElement('img');
    img.alt = alt || '';
    img.loading = 'lazy';
    if (rot) img.classList.add('rot90');

    let progress = 0;
    let fakeTimer = null;
    let finished = false;

    function setProgress(v){
      progress = Math.max(progress, Math.min(100, v));
      status.textContent = Math.round(progress) + '%';
      const alpha = (0.25 + (progress / 100) * 0.75).toFixed(2);
      wrap.style.borderColor = 'rgba(57,255,20,' + alpha + ')';
      wrap.style.boxShadow = progress >= 100
        ? '0 0 10px rgba(57,255,20,.35)'
        : 'none';
    }

    function finish(){
      if (finished) return;
      finished = true;
      if (fakeTimer){ clearInterval(fakeTimer); fakeTimer = null; }
      setProgress(100);
      wrap.classList.remove('loading');
      wrap.classList.add('done');
    }

    img.addEventListener('load', finish, {once:true});
    img.addEventListener('error', function(){
      finish();
      status.textContent = 'ERR';
    }, {once:true});

    // медленная плавная «догрузка» до 92%, потом onload даёт 100%
    let fake = 0;
    fakeTimer = setInterval(function(){
      if (finished) return;
      fake += Math.random() * 9 + 2;
      if (fake >= 92) fake = 92;
      setProgress(fake);
    }, 180);

    setProgress(0);
    img.src = IMG[key];

    wrap.appendChild(status);
    wrap.appendChild(img);
    termBody.appendChild(wrap);
    termBody.scrollTop = termBody.scrollHeight;
  }

  /* ---------- Смайлик из точек снизу вверх (с улыбкой) ---------- */
  function drawSmiley(){
    // строки заданы СВЕРХУ ВНИЗ, но выводим их снизу вверх
    // (последняя строка массива печатается первой)
    const lines = [
      "   ·  ·  ·  ·  ·  ·   ",   // верх контура
      " ·                   · ",
      "·    ●           ●    ·",   // глаза
      "·                     ·",
      " ·    \\         /    · ",
      "  ·    \\_______/    ·  ",   // улыбка (дуга)
      "   ·  ·  ·  ·  ·  ·   "    // низ
    ];

    const pre = document.createElement('pre');
    pre.className = 'smiley';
    termBody.appendChild(pre);
    termBody.scrollTop = termBody.scrollHeight;

    // печатаем снизу вверх: начинаем с последней строки массива
    let idx = lines.length - 1;

    function step(){
      if (idx < 0) return;
      const span = document.createElement('span');
      span.className = 'ln';
      span.textContent = lines[idx] + "\n";
      // вставляем в начало pre, чтобы визуально шло снизу вверх
      pre.insertBefore(span, pre.firstChild);
      termBody.scrollTop = termBody.scrollHeight;
      idx--;
      typingTimers.push(setTimeout(step, 220));
    }
    step();
  }

  /* ---------- Выйти ---------- */
  btnExit.addEventListener('click', function(){
    blackout.classList.add('active');
    clearTyping();
    setTimeout(function(){
      terminal.classList.remove('show');
      termBody.innerHTML = '';
      btnStart.dataset.running = '';
      btnStart.classList.remove('hidden');
      btnExit.classList.add('hidden');
      btnReset.classList.add('hidden');

      startScreen.style.display = 'flex';
      void startScreen.offsetWidth;
      startScreen.style.opacity = '1';
      cmdInput.value = '';
      busy = false;

      blackout.classList.remove('active');
    }, 1000);
  });

  /* ---------- Сбросить ---------- */
  btnReset.addEventListener('click', function(){
    clearTyping();
    termBody.innerHTML = '';
    btnStart.dataset.running = '';
    btnStart.classList.remove('hidden');
    btnExit.classList.add('hidden');
    btnReset.classList.add('hidden');
    termBody.scrollTop = 0;
  });

  /* ---------- Мелочи ---------- */
  document.addEventListener('touchmove', function(e){
    if (e.target.closest('.termBody')) return;
    if (e.touches.length > 1) e.preventDefault();
  }, {passive:false});

  window.addEventListener('resize', function(){
    if (document.activeElement === cmdInput){
      setTimeout(function(){ cmdInput.scrollIntoView({block:'center'}); }, 50);
    }
  });

})();
</script>
</body>
</html>
